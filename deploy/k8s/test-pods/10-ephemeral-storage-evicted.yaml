apiVersion: v1
kind: Pod
metadata:
  name: test-ephemeral-storage-evicted
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: ephemeral-storage-evicted
spec:
  restartPolicy: Always
  containers:
    - name: disk-filler
      image: busybox:1.36
      command: ["sh", "-c", "dd if=/dev/zero of=/tmp/bigfile bs=1M count=10 && sleep 3600"]
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
          ephemeral-storage: "1Mi"
        limits:
          memory: "32Mi"
          cpu: "50m"
          ephemeral-storage: "1Mi"
