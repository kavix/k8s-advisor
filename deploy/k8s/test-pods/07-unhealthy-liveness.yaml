apiVersion: v1
kind: Pod
metadata:
  name: test-unhealthy-liveness
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: unhealthy-liveness
spec:
  restartPolicy: Always
  containers:
    - name: deadlocked-app
      image: busybox:1.36
      command: ["sleep", "3600"]
      livenessProbe:
        exec:
          command: ["false"]
        initialDelaySeconds: 3
        periodSeconds: 5
        failureThreshold: 2
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
