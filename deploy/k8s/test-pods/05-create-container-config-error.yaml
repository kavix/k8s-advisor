apiVersion: v1
kind: Pod
metadata:
  name: test-create-container-config-error
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: create-container-config-error
spec:
  restartPolicy: Always
  containers:
    - name: missing-cfg
      image: busybox:1.36
      command: ["sleep", "3600"]
      envFrom:
        - configMapRef:
            name: nonexistent-app-config
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
