apiVersion: v1
kind: Pod
metadata:
  name: test-unhealthy-readiness
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: unhealthy-readiness
spec:
  restartPolicy: Always
  containers:
    - name: unready-app
      image: busybox:1.36
      command: ["sleep", "3600"]
      readinessProbe:
        exec:
          command: ["cat", "/tmp/ready"]
        initialDelaySeconds: 2
        periodSeconds: 5
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
