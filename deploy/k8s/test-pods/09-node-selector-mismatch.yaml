apiVersion: v1
kind: Pod
metadata:
  name: test-node-selector-mismatch
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: node-selector-mismatch
spec:
  restartPolicy: Always
  nodeSelector:
    gpu-tier: h100-ultra-nonexistent
  containers:
    - name: gpu-job
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
