apiVersion: v1
kind: Pod
metadata:
  name: test-failed-scheduling-resources
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: failed-scheduling-resources
spec:
  restartPolicy: Always
  containers:
    - name: huge-pod
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "999"
          memory: "999Gi"
