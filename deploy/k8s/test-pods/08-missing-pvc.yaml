apiVersion: v1
kind: Pod
metadata:
  name: test-missing-pvc
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: missing-pvc
spec:
  restartPolicy: Always
  containers:
    - name: db-worker
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: missing-data-pvc
