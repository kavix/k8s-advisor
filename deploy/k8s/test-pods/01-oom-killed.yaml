apiVersion: v1
kind: Pod
metadata:
  name: test-oom-killed
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: oom-killed
spec:
  restartPolicy: Always
  containers:
    - name: oom-hog
      image: busybox:1.36
      command: ["sh", "-c", "dd if=/dev/zero of=/dev/shm/fill bs=1M count=64 && sleep 300"]
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
        limits:
          memory: "32Mi"
          cpu: "50m"
