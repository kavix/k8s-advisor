apiVersion: v1
kind: Pod
metadata:
  name: test-crash-loop-backoff
  namespace: default
  labels:
    app: k8s-advisor-test
    scenario: crash-loop-backoff
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Fatal startup error: config missing' >&2; exit 1"]
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
